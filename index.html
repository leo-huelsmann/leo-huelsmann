<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Template</title>

  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/screen.css">

  <script type="module" src="assets/js/main.js"></script>


</head>


<body>
  <!-- Fixed Header Overlay -->
  <div class="header fixed-header" id="fixed-header">
    <div class="header-left">
      <div id="fh-stadt"></div>
      <div id="fh-station"></div>
    </div>
    <div class="header-right">
      <div id="fh-stadtteil"></div>
      <div id="fh-coords"></div>
      <div id="fh-eröffnung"></div>
    </div>
    <div class="ubahn-logo">U</div>
  </div>

  <main class="carousel" id="carousel"></main>

  <!-- Fixed Footer Overlay -->
  <div class="footer fixed-footer" id="fixed-footer">
    <div class="footer-left">
      <div class="footer-left-top uppercase" id="ff-left-top"></div>
      <div id="ff-seite" class="uppercase"></div>
    </div>
    <div class="footer-right">
      <div class="block-text" id="ff-review"></div>
    </div>
  </div>

  <!-- Navigation Arrows -->
  <button id="nav-arrow-left" class="nav-arrow" aria-label="Previous slide">&larr;</button>
  <button id="nav-arrow-right" class="nav-arrow" aria-label="Next slide">&rarr;</button>
</body>

</html>
